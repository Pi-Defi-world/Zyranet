# ===========================================================================
# Override for a reviewed management host: api + worker use HOST networking
# to observe approved management subnets. DB stays in a container on loopback.
# Enable the optional RADIUS profile only after access-equipment compatibility
# and the authentication policy are confirmed.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --build
# ===========================================================================

services:
  db:
    # Base compose already binds 127.0.0.1:5432 — no override needed here. — never exposed to LAN

  api:
    build: .
    container_name: zyranet-api
    network_mode: host
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8000"
    env_file: .env
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_URL: ""
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: zyranet-worker
    network_mode: host
    command: python -m app.worker
    env_file: .env
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_URL: ""
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  radius:
    profiles: ["radius"]
    build: ./radius
    container_name: zyranet-radius
    network_mode: host
    environment:
      RADIUS_SQL_USER: "zyranet"
      RADIUS_SQL_PASSWORD: "${DB_PASSWORD:-}"
      RADIUS_SECRET: "${RADIUS_SECRET:-}"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: zyranet
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
