# ===========================================================================
# Zyranet production deploy — Linux Mint server
#
# PostgreSQL + FreeRADIUS run natively on the host.
# API + Bot run in Docker, connecting to native services.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# ===========================================================================

services:
  api:
    build: .
    container_name: zyranet-api
    network_mode: host
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_URL: postgresql+asyncpg://zyranet:change-me@127.0.0.1:5432/zyranet
    restart: unless-stopped

  bot:
    build: .
    container_name: zyranet-bot
    network_mode: host
    command: python -m bot.main
    env_file: .env
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_URL: postgresql+asyncpg://zyranet:change-me@127.0.0.1:5432/zyranet
    restart: unless-stopped
