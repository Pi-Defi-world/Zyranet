# CoovaChilli / guest gateway RADIUS client.
client chilli-gateway {
    ipaddr = 172.16.30.1
    secret = __RADIUS_SECRET__
    shortname = chilli-gateway
    nastype = other
}

# Loopback so `radtest` works from inside the container for testing.
client localhost {
    ipaddr = 127.0.0.1
    secret = __RADIUS_SECRET__
    shortname = localhost
    nastype = other
}
