# ===========================================================================
# FreeRADIUS clients.conf
# Every device that sends RADIUS to this server is a "client".
# For Zyranet the only RADIUS client is CoovaChilli (the guest gateway).
#
# NOTE: secrets here are TEMPLATES. A deploy script copies this to
# /etc/freeradius/clients.conf and substitutes RADIUS_SECRET from .env.
# Never commit real secrets.
# ===========================================================================

client localhost {
    ipaddr = 127.0.0.1
    secret = changeme
    require_message_authenticator = no
    nastype = other
}

client chilligw {
    ipaddr = 172.16.30.1
    secret = __RADIUS_SECRET__
    shortname = chilli-gateway
    nastype = other
}

