# ===========================================================================
# FreeRADIUS clients.conf template.
# Add only confirmed network devices and their actual management addresses.
#
# NOTE: secrets here are TEMPLATES. A deploy script copies this to
# /etc/freeradius/clients.conf and substitutes RADIUS_SECRET from .env.
# Never commit real secrets.
# ===========================================================================

client localhost {
    ipaddr = 127.0.0.1
    secret = __RADIUS_SECRET__
    require_message_authenticator = no
    nastype = other
}

