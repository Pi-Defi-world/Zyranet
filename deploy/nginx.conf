# ===========================================================================
# nginx reverse proxy for the Zyranet API + Telegram/payment webhooks.
# Terminates TLS. Deploy to /etc/nginx/sites-available/zyranet and enable.
# ===========================================================================

server {
    listen 80;
    server_name zyranet.local;          # your LAN/host name
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zyranet.local;

    ssl_certificate     /etc/letsencrypt/live/zyranet.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zyranet.local/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment + Telegram webhooks.
    location /api/payments/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger / docs (optional; restrict if desired).
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
