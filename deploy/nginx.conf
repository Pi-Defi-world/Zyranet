# ===========================================================================
# TLS reverse proxy for the Zyranet API and dashboard.
# Replace the example host and certificate paths with the University's DNS name
# and an issued certificate (institutional PKI for private DNS, or a public CA).
# The API itself binds to loopback; do not publish port 8000 to the campus LAN.
# ===========================================================================

server {
    listen 80;
    server_name zyranet.example.edu;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zyranet.example.edu;

    ssl_certificate     /etc/ssl/zyranet/fullchain.pem;
    ssl_certificate_key /etc/ssl/zyranet/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Overwrite forwarded client information so callers cannot spoof the
    # address used for login throttling. The API trusts this proxy only.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
