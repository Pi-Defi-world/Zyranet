services:
  db:
    image: postgres:16-alpine
    container_name: zyranet-db
    environment:
      POSTGRES_USER: zyranet
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-me}"
      POSTGRES_DB: zyranet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zyranet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyranet -d zyranet"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: zyranet-api
    # Migrations are the single source of truth for the schema (see backend/alembic).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_URL: ""
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build: .
    container_name: zyranet-worker
    command: python -m app.worker
    env_file: .env
    environment:
      DB_HOST: db
      DB_URL: ""
    cap_add:
      - NET_RAW
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zyranet_pgdata:
