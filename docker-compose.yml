services:
  db:
    image: postgres:16-alpine
    container_name: zyranet-db
    environment:
      POSTGRES_USER: zyranet
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-me}"
      POSTGRES_DB: zyranet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zyranet_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyranet -d zyranet"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: zyranet-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: .
    container_name: zyranet-bot
    command: python -m bot.main
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zyranet_pgdata:
