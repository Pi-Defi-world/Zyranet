[project]
name = "zyranet"
version = "0.1.0"
description = "Vendor-neutral campus network operations for AUE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "pysnmp>=7.1,<8",
    "manuf>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[tool.setuptools]
# Only `app` is an importable Python package; db/, raddb/, chilli/,
# deploy/ and docs/ are non-package artifact directories.
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI uses Depends() in argument defaults idiomatically.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
